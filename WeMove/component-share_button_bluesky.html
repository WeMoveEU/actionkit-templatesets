<script>
  document.addEventListener('wm-scriptsLoaded', () => {
    {# Share step AB test S2 #}
    {# Description: Only for whatsapp, based on a custom field we load an specific share text and image for wa #}
    {# AB test page: https://action.wemove.eu/admin/lab/dash/37 #}
    {# Example: https://action.wemove.eu/thanks/2026-06-dont-send-our-data-to-the-US-petition-EN_copy/?variation=141&share=1 #}
    {# Variations: 141, 142 and 143 #}
    {% if tests and tests.37 %}
      {% if page.custom_fields.share_step_abtest_s2 == "action" %}
        window.blueskyShareText = wemove.utilities.decodeHTML((`{% filter ak_text:"share_step_abtest_s2_action"|escapeall %}I just signed a petition to protect workers from extreme heat. Right now, millions of workers across Europe have zero legal protection, and this won't be the last heatwave. Join me to keep workers safe: {% endfilter %}`);
      {% elif page.custom_fields.share_step_abtest_s2 == "concern" %}
        window.blueskyShareText = wemove.utilities.decodeHTML((`{% filter ak_text:"share_step_abtest_s2_concern"|escapeall %}I just learned there's no law saying when it's too hot to work. Every time a heatwave hits, millions of us risk injury, illness or even death. This worried me a lot and hardly anyone's talking about it. But pressure is growing, some countries are already introducing maximum work temperatures. I just signed, will you?{% endfilter %}`);
      {% elif page.custom_fields.share_step_abtest_s2 == "question" %}
        window.blueskyShareText = wemove.utilities.decodeHTML((`{% filter ak_text:"share_step_abtest_s2_question"|escapeall %}Did you know there's no law saying when it's too hot to work? It's hard to believe, but millions of workers across Europe have zero legal protection from extreme heat, and heatwaves are only getting worse. The EU could change this with an upcoming law, but nothing is set in stone yet. Sign and share, that's how we make this impossible to ignore: {% endfilter %}`);
      {% else %}
        window.blueskyShareText = wemove.utilities.decodeHTML((`{{ page.followup.twitter_message|default:page.title|escapeall }}`);
      {% endif %}
    {% else %}
      window.blueskyShareText = wemove.utilities.decodeHTML((`{{ page.followup.twitter_message|default:page.title|escapeall }}`);
    {% endif %}
  });
</script>

{% if args.share == "bluesky" %}
  {% include "./component-share_from_mailings_script.html" %}
{% endif %}

<a
  class="mb-4 transition-all text-center w-full bg-bluesky !text-white font-bold uppercase p-3 font-gilroy rounded flex items-center gap-2 justify-center hover:!no-underline hover:bg-bluesky-hv"
  href="/share/link?type=bl&page_name={{ pageName }}{% if action %}&action_id={{ action.id }}{% else %}&akid={{ akid }}{% endif %}{% if args.variation %}&variation={{ args.variation }}{% endif %}"
  target="_blank">
  <span aria-hidden="true" class="h-4 w-4">
    {% include "./icon-bluesky.html" %}
  </span>
  <span>{% filter ak_text:"thanks_shareBluesky_button" %}Share on Bluesky{% endfilter %}</span>
</a>
