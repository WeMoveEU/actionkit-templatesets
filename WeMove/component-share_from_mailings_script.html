<script>
  (async () => {
    const socialType = "{{ args.share }}";

    const decodeHTML = (html) => {
      var txt = document.createElement('textarea');
      txt.innerHTML = html;

      return txt.value;
    };

    {# Share step AB test S2 #}
    {# Description: Only for whatsapp, based on a custom field we load an specific share text and image for wa #}
    {# AB test page: https://action.wemove.eu/admin/lab/dash/37 #}
    {# Example: https://action.wemove.eu/thanks/2026-06-dont-send-our-data-to-the-US-petition-EN_copy/?variation=141&share=1 #}
    {# Variations: 141, 142 and 143 #}

    {% if tests and tests.37 %}
      {% if page.custom_fields.share_step_abtest_s2 == "action" %}
        const title = decodeHTML(`{% filter ak_text:"share_step_abtest_s2_action"|escapeall %}I just signed a petition to protect workers from extreme heat. Right now, millions of workers across Europe have zero legal protection, and this won't be the last heatwave. Join me to keep workers safe: {% endfilter %}`);
      {% elif page.custom_fields.share_step_abtest_s2 == "concern" %}
        const title = decodeHTML(`{% filter ak_text:"share_step_abtest_s2_concern"|escapeall %}I just learned there's no law saying when it's too hot to work. Every time a heatwave hits, millions of us risk injury, illness or even death. This worried me a lot and hardly anyone's talking about it. But pressure is growing, some countries are already introducing maximum work temperatures. I just signed, will you?{% endfilter %}`);
      {% elif page.custom_fields.share_step_abtest_s2 == "question" %}
        const title = decodeHTML(`{% filter ak_text:"share_step_abtest_s2_question"|escapeall %}Did you know there's no law saying when it's too hot to work? It's hard to believe, but millions of workers across Europe have zero legal protection from extreme heat, and heatwaves are only getting worse. The EU could change this with an upcoming law, but nothing is set in stone yet. Sign and share, that's how we make this impossible to ignore: {% endfilter %}`);
      {% else %}
        const title = decodeHTML(`{{ page.followup.twitter_message|default:page.title|escapeall }}`);
      {% endif %}
    {% else %}
    const title = decodeHTML(`{{ page.followup.twitter_message|default:page.title|escapeall }}`);
    {% endif %}

    const AKSharePageURL = "/share/link?type=ot&source={{args.share}}&page_name={{pageName}}&akid={{ akid }}{% if action %}&action_id={{ action.id }}{% endif %}{% if args.variation %}&variation={{ args.variation }}{% endif %}";

    const URLToShare = await fetch(AKSharePageURL)
      .then(async (result) => {
        return await result.text();
      });

    const socialURL = () => {
      if (socialType === "whatsapp") {
        const isMobile = () => /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        return isMobile()
          ? "whatsapp://send/"
          : "https://api.whatsapp.com/send/";
          //: "https://wa.me/" Emojis not working;
      }

      // Bluesky
      return "https://bsky.app/intent/compose";
    };

    const shareTextWithURL = encodeURIComponent(`${title} ${URLToShare}&source=${socialType}`)

    window.location.href = `${socialURL()}?text=${shareTextWithURL}`;
  })();
</script>
